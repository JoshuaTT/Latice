# LATTICE agent swarm roster. One line per agent session.
#
# name         Short agent name. The session is called "lattice-<name>", and
#              workers pick up issues labeled "swarm:<name>".
# role         coordinator | worker
# adapter      claude-code | opencode | codex   (selects specs/<adapter>.yaml)
# model        DigitalOcean Inference model ID. Check with: ./swarm.sh models
# size         Sandbox size (mars-2vcpu-4gb, mars-4vcpu-8gb, mars-16vcpu-32gb, ...)
#
# Mixing models across workers is deliberate: it doubles as data on which
# models build well together. Claude models run best in claude-code; use
# opencode or codex for other model families.
#
# name         role         adapter      model                          size
coordinator    coordinator  claude-code  anthropic-claude-opus-5        mars-2vcpu-4gb
w1             worker       claude-code  anthropic-claude-opus-5        mars-4vcpu-8gb
w2             worker       claude-code  anthropic-claude-sonnet-5.5    mars-4vcpu-8gb
w3             worker       opencode     kimi-k3                        mars-4vcpu-8gb
w4             worker       codex        openai-gpt-6-sol               mars-4vcpu-8gb
