# Default LATTICE ruleset
# Parameters from game-design.md §14.2, §4.0, §6, and §13
# Version: v1.0.0

version = "1.0.0"

# Match timing (game-design §14.2, §3)
[match]
epochs_per_match = 4          # game-design §14.2
beats_per_council = 16        # game-design §14.2
beat_length_seconds = 45      # game-design §14.2, §3.3
charge_bank_cap = 3           # game-design §14.2

# Muster phase tokens (game-design §14.2, §8)
[muster]
opening_tokens = 500           # game-design §14.2
reply_tokens = 200             # game-design §14.2

# Bandwidth limits (game-design §14.2, §9.3)
[bandwidth]
personal_tokens = 800         # game-design §14.2
shared_pool_tokens = 3000     # game-design §14.2

# Quota and economy (game-design §14.2, §9.4)
[quota]
team_complexity_nodes = 2400  # game-design §14.2
transfer_loss_percent = 20     # game-design §14.2
sim_credits = 15              # game-design §14.2

# Board parameters (game-design §14.2, §4.3, §4.4)
[board]
side_length = 64              # game-design §14.2 (default)
core_hp = 200                 # game-design §14.2, §4.4
core_firewall = 40            # game-design §14.2, §4.4
drone_hp = 10                 # game-design §14.2, §5
drone_firewall = 3            # game-design §14.2, §5

# Board-size scaling parameters (game-design §4.0)
# s = side_length / 64, ranges from 1 to 16
[scaling]
# Clash length: 2000 * sqrt(s) ticks
clash_length_ticks = { base = 2000, formula = "base * sqrt(s)" }
clash_length_base = 2000      # game-design §14.2 exploration range

# Drone cap: 60 * sqrt(s)
drone_cap = { base = 60, formula = "base * sqrt(s)" }
drone_cap_base = 60           # game-design §14.2

# Wells: 6 * s
wells = { base = 6, formula = "base * s" }

# Neutral Forges: 2 * s
neutral_forges = { base = 2, formula = "base * s" }

# Relics: 2 + log2(s)
relics = { base = 2, formula = "base + log2(s)" }

# Starting energy: 400 * sqrt(s)
starting_energy = { base = 400, formula = "base * sqrt(s)" }
starting_energy_base = 400    # game-design §14.2

# Intel shards: constant 5 regions
intel_shards = 5              # game-design §4.0

# Fuel per tick
fuel_per_tick = 1000            # game-design §14.2

# Score weights (game-design §13)
[score_weights]
owned_cells = 1                # game-design §13
wells_held = 15               # game-design §13
relics_held = 60              # game-design §13
remaining_core_hp = 1         # game-design §13
live_drones = 3               # game-design §13

# Structural parameters (system-design §6.3, game-design §9.5)
# These cannot be auto-tuned and require human approval
[structural]
team_size = 5                 # game-design §9.5
quorum = 3                    # game-design §9.5 (3 of 5)
win_conditions = [
  "core_destroyed",
  "core_captured",
  "score_after_final_epoch"
]                             # game-design §13

# Mutator pool (game-design §6)
[mutators]
pool = [
  "Fog",
  "Costly Spawn",
  "Quiet Radio",
  "Small Board",
  "Glass Core",
  "Plague",
  "Thin Air",
  "Banned Call",
  "Drift",
  "Long Night"
]                             # game-design §6
draw_count = 2                # game-design §6 (2-3)

# Per-act energy costs and mechanics (mechanics §1, §2)
[acts]
move_energy_cost = 0          # mechanics §1; no energy cost
claim_energy_cost = 1         # mechanics §1
harvest_energy_cost = 0       # mechanics §1
attack_energy_cost = 2        # mechanics §1
hack_energy_cost = 3          # mechanics §1
patch_energy_cost = 1         # mechanics §1
build_energy_cost = 0         # mechanics §1; per-structure cost applies on top
spawn_energy_cost = 20        # mechanics §4
repair_energy_cost = 2        # mechanics §1
deposit_energy_cost = 0       # mechanics §1
withdraw_energy_cost = 0      # mechanics §1
attack_damage = 3             # mechanics §2
hack_firewall_reduction = 1   # mechanics §2
patch_firewall_restore = 2    # mechanics §2
repair_hp_restore = 2         # mechanics §2
harvest_yield = 5             # mechanics §2

# Drone parameters
[drone]
carry_cap = 20                # mechanics §2; max energy a drone carries

# Economy (mechanics §3)
[economy]
well_yield_per_tick = 2       # mechanics §2; passive energy per tick per Well
drone_upkeep_per_tick = 0     # mechanics §3; v1 has no upkeep

# Structure build costs and stats (mechanics §5)
[structures.barrier]
build_cost = 8                # mechanics §5
hp = 20                       # game-design §4.3
firewall = 0                  # mechanics §5
effect_radius = 0             # mechanics §5

[structures.relay]
build_cost = 12               # mechanics §5
hp = 10                       # mechanics §5
firewall = 0                  # mechanics §5
effect_radius = 6             # mechanics §9

[structures.battery]
build_cost = 15               # mechanics §5
hp = 10                       # mechanics §5
firewall = 0                  # mechanics §5
effect_radius = 0             # mechanics §5
capacity = 100                # mechanics §5; max energy stored

[structures.sentinel]
build_cost = 20               # mechanics §5
hp = 10                       # mechanics §5
firewall = 3                  # mechanics §5
effect_radius = 1             # mechanics §5
fuel_per_tick = 30            # mechanics §5

[structures.firewall_node]
build_cost = 15               # mechanics §5
hp = 10                       # mechanics §5
firewall = 0                  # mechanics §5
effect_radius = 3             # game-design §4.3
firewall_bonus = 2            # game-design §4.3

[structures.forge]
build_cost = 50               # mechanics §5
hp = 15                       # mechanics §5
firewall = 0                  # mechanics §5
effect_radius = 0             # mechanics §5

# Cell parameters (mechanics §6)
[cell]
default_integrity = 1         # mechanics §6
max_integrity = 3             # mechanics §6
claimable_terrains = ["open", "well", "relic", "forge", "core"]
walkable_terrains = ["open", "well", "relic", "forge", "core"]

# Relic parameters (mechanics §8)
[relics]
hp = 30                       # game-design §4.5
hackable = false              # mechanics §8
repairable = false            # mechanics §8

# Sensing parameters (mechanics §9)
[sensing]
default_radius = 5            # mechanics §9
max_radius = 10               # mechanics §9
relay_extension = 3           # mechanics §9

# Mark parameters (mechanics §10)
[marks]
max_ttl = 500                 # mechanics §10; ticks
value_size_bytes = 64         # mechanics §10
max_per_cell = 4              # mechanics §10

# Hack mechanics (mechanics §11)
[hack]
converted_firewall = 2        # mechanics §11; firewall a captured drone starts with