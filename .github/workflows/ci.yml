# Required checks for `main`. The job names (lint, test, contracts,
# determinism, perf-budget) are referenced by
# .github/rulesets/main-protection.json — never rename them.
#
# Every job runs on every PR (no path filters), because a required check
# that never reports blocks merging. Each job runs the real checks once the
# relevant part of the repo exists, and passes with a notice until then.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust lint
        if: hashFiles('Cargo.toml') != ''
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Set up uv
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6
      - name: Python lint
        if: hashFiles('pyproject.toml') != ''
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Nothing to lint yet
        if: hashFiles('Cargo.toml') == '' && hashFiles('pyproject.toml') == ''
        run: echo "::notice::No Rust or Python code yet; lint skipped"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --all-features

      - name: Set up uv
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6
      - name: Python tests
        if: hashFiles('pyproject.toml') != ''
        run: |
          uv sync --all-packages --dev
          uv run pytest

      - name: Nothing to test yet
        if: hashFiles('Cargo.toml') == '' && hashFiles('pyproject.toml') == ''
        run: echo "::notice::No Rust or Python code yet; tests skipped"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate contract schemas
        run: |
          if [ -d spec/contracts ] && [ -n "$(find spec/contracts -name '*.schema.json' -print -quit)" ]; then
            pipx install check-jsonschema
            find spec/contracts -name '*.schema.json' -print0 \
              | xargs -0 check-jsonschema --check-metaschema
          else
            echo "::notice::No schemas in spec/contracts yet"
          fi
      - name: Validate examples against schemas
        run: |
          # Convention: spec/contracts/examples/<name>/valid/*.json and invalid/*.json
          # are checked against spec/contracts/<name>.schema.json.
          shopt -s nullglob
          dirs=(spec/contracts/examples/*/)
          [ ${#dirs[@]} -eq 0 ] && { echo "::notice::No contract examples yet"; exit 0; }
          command -v check-jsonschema >/dev/null || pipx install check-jsonschema
          status=0
          for dir in spec/contracts/examples/*/; do
            name=$(basename "$dir")
            schema="spec/contracts/$name.schema.json"
            [ -f "$schema" ] || { echo "::error::Examples for '$name' have no schema"; status=1; continue; }
            for f in "$dir"valid/*.json; do
              check-jsonschema --schemafile "$schema" "$f" || status=1
            done
            for f in "$dir"invalid/*.json; do
              if check-jsonschema --schemafile "$schema" "$f" >/dev/null 2>&1; then
                echo "::error file=$f::Invalid example unexpectedly passed $schema"; status=1
              fi
            done
          done
          exit $status

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        if: hashFiles('Cargo.toml') != '' && hashFiles('tests/golden/**') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Verify golden replays (native)
        if: hashFiles('Cargo.toml') != '' && hashFiles('tests/golden/**') != ''
        run: cargo run --release -p lattice-cli -- replay --verify tests/golden
      - name: No golden replays yet
        if: hashFiles('Cargo.toml') == '' || hashFiles('tests/golden/**') == ''
        run: echo "::notice::No golden replays yet; determinism check skipped"

  perf-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        if: hashFiles('engine/benches/**') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: PR-sized performance budgets (system design §11.4)
        if: hashFiles('engine/benches/**') != ''
        run: cargo bench -p lattice-engine -- --budget
      - name: No benchmarks yet
        if: hashFiles('engine/benches/**') == ''
        run: echo "::notice::No benchmarks yet; perf budget skipped"
