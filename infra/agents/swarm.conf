# LATTICE agent swarm roster. One line per agent session.
#
# name         Short agent name. The session is called "lattice-<name>", and the
#              agent marks issues it claims with the label "swarm:<name>".
# role         coordinator  product owner + quality control: writes and prioritizes
#                           the backlog, reviews PRs, decides milestones; never assigns
#              worker       picks its own tasks from the ready backlog
#              tester       runs real scenarios, owns the harness, files bugs
# adapter      claude-code | opencode | codex   DigitalOcean session (specs/<adapter>.yaml)
#              local                            Claude Code on this machine, billed to your
#                                               own Anthropic account (see README.md)
# model        DigitalOcean: Inference model ID. Check with: ./swarm.sh models
#              local: a Claude Code model alias (opus, sonnet, haiku) or full model name
# size         DigitalOcean sandbox size (mars-2vcpu-4gb, mars-4vcpu-8gb, ...); "-" for local
#
# Mixing models across workers is deliberate: it doubles as data on which
# models build well together. Claude models run best in claude-code; use
# opencode or codex for other model families.
#
# name         role         adapter      model                          size
coordinator    coordinator  local        opus                           -
w1             worker       local        opus                           -
w2             worker       opencode     qwen3.8-max                    mars-4vcpu-8gb
tester         tester       opencode     minimax-m2.5                   mars-4vcpu-8gb
#
# To run an agent on your laptop with your Anthropic account instead, use the
# local adapter. For example, the coordinator on Claude Opus:
# coordinator  coordinator  local        opus                           -
#
# Claude and GPT models need DigitalOcean Inference Tier 3 or above (Tier 1-2
# accounts get HTTP 403 "not available for your subscription tier"). Once your
# account qualifies, swap these back in (./swarm.sh check verifies access):
# coordinator  coordinator  claude-code  anthropic-claude-opus-5        mars-2vcpu-4gb
# w1           worker       claude-code  anthropic-claude-opus-5        mars-4vcpu-8gb
